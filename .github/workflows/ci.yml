name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:types
      # Includes the credential hygiene check, which fails the build if an API key or a field
      # carrying one is committed to source, configuration, or CI definitions.
      - run: npm test
